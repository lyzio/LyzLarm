name: Bug
description: Something doesn't work, for example an alarm didn't ring
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set an alarm for …
        2. Lock the screen
        3. …
  - type: input
    id: version
    attributes:
      label: LyzLarm version
      description: Settings › About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Fairphone 6, Android 16"
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: System check
      description: Which items in Settings › System check show "Fix"?
