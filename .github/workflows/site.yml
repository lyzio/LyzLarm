name: Website

# Rebuilds lyzio.github.io/LyzLarm on each release, each change to an issue
# (the roadmap), and each change to site/ on master.
on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/site.yml"]
  release:
    types: [published, edited, deleted]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned, deleted]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
