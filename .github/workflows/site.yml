name: Website

# Rebuilds lyzio.github.io/LyzLarm only when something is merged to master or a
# release is published (so the site shows the new version). Branches and pull
# requests never build it; roadmap issue edits show up at the next rebuild.
# The Release workflow creates releases with the built-in token, which does not
# fire the `release` event, so `workflow_run` covers tagged releases.
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
